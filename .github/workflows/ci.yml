name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-watchdog.ts --parallel=4 --timeout=20000 --no-orphans --shard=${{ matrix.shard }}/6 --timings=test-timings.json

  test-postgres:
    name: test (postgres ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services: &postgres-service
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PAWS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Test files whose database follows PAWS_TEST_DATABASE_URL (helpers in test/pglite.ts).
      DATABASE_TESTS: &database-tests tempStore|serverPostgres|describePglite|pgliteServer|improvement-fixtures|decision-memory-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Select the database tests, without test/postgres-known-failures.txt
        run: |
          sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^$/d' test/postgres-known-failures.txt > "$RUNNER_TEMP/known-failures"
          grep -rlE "$DATABASE_TESTS" test --include='*.test.ts' | grep -vxFf "$RUNNER_TEMP/known-failures" | sed 's|^|./|' > "$RUNNER_TEMP/database-tests"
          wc -l < "$RUNNER_TEMP/database-tests"
      - run: bun scripts/test-watchdog.ts --parallel=4 --timeout=20000 --no-orphans --shard=${{ matrix.shard }}/3 ./src/db/ $(cat "$RUNNER_TEMP/database-tests")

  select-changed-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - id: select
        env:
          DATABASE_TESTS: *database-tests
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/stress-tests.ts "origin/$BASE_REF"

  changed-tests:
    name: changed tests (${{ matrix.dialect }}, batch ${{ matrix.batch }}, 3 runs)
    needs: [select-changed-tests]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select-changed-tests.outputs.matrix) }}
    services: *postgres-service
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run each selected test file three times
        env:
          STRESS_DIALECT: ${{ matrix.dialect }}
          PAWS_TEST_DATABASE_URL: ${{ matrix.dialect == 'postgres' && 'postgres://postgres:postgres@127.0.0.1:5432/postgres' || '' }}
          STRESS_FILES: ${{ toJSON(matrix.files) }}
        run: bun scripts/stress-tests.ts --run

  check:
    name: lint, format, types, test, dashboard build
    runs-on: ubuntu-latest
    needs: [test, test-postgres, select-changed-tests, changed-tests]
    if: always()
    steps:
      - name: Require successful test results
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_RESULT: ${{ needs.test-postgres.result }}
          SELECTION_RESULT: ${{ needs.select-changed-tests.result }}
          STRESS_RESULT: ${{ needs.changed-tests.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$POSTGRES_RESULT" = success
          if [ "$EVENT_NAME" = push ]; then
            test "$SELECTION_RESULT" = skipped
            test "$STRESS_RESULT" = skipped
          else
            test "$SELECTION_RESULT" = success
            test "$STRESS_RESULT" = success
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run build:dashboard
      - run: bun run links
      - run: bun run raw-sql
      - run: bun run graphql
      - run: bun run knip
      - run: bun scripts/check-runner-versions.ts --since-latest-release

  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-binary.ts x64
        env:
          PAWS_VERSION: ci-${{ github.sha }}
      - run: bun scripts/smoke-binary.ts

  apt-repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - run: bash deploy/linux/test-apt.sh
