name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-watchdog.ts --parallel=4 --timeout=20000 --no-orphans --shard=${{ matrix.shard }}/6 --timings=test-timings.json

  test-postgres:
    name: test (postgres ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PAWS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Test files whose database follows PAWS_TEST_DATABASE_URL (helpers in test/pglite.ts).
      DATABASE_TESTS: tempStore|serverPostgres|forEachDialect|pgliteServer|improvement-fixtures|decision-memory-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Select the database tests, without test/postgres-known-failures.txt
        run: |
          sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^$/d' test/postgres-known-failures.txt > "$RUNNER_TEMP/known-failures"
          grep -rlE "$DATABASE_TESTS" test --include='*.test.ts' | grep -vxFf "$RUNNER_TEMP/known-failures" | sed 's|^|./|' > "$RUNNER_TEMP/database-tests"
          wc -l < "$RUNNER_TEMP/database-tests"
      - run: bun scripts/test-watchdog.ts --parallel=4 --timeout=20000 --no-orphans --shard=${{ matrix.shard }}/3 ./src/db/ $(cat "$RUNNER_TEMP/database-tests")

  check:
    name: lint, format, types, test, dashboard build
    runs-on: ubuntu-latest
    needs: [test, test-postgres]
    if: always()
    steps:
      - if: needs.test.result != 'success' || needs.test-postgres.result != 'success'
        run: |
          echo "A test shard failed: ${{ needs.test.result }}, postgres: ${{ needs.test-postgres.result }}"
          exit 1
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run build:dashboard
      - run: bun run links
      - run: bun run raw-sql
      - run: bun run graphql
      - run: bun run knip
      - run: bun scripts/check-runner-versions.ts --since-latest-release
