name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, format, types, test, dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - name: Enable required namespace fixture on this runner
        run: |
          uname -a
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces
          sudo aa-status
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile paws-ci-unshare /usr/bin/unshare flags=(unconfined) {' '  userns,' '}' > "$RUNNER_TEMP/paws-ci-unshare"
          sudo apparmor_parser --replace "$RUNNER_TEMP/paws-ci-unshare"
          unshare -Ur -m sh -c 'test "$(id -u)" = 0; mount --make-rprivate /'
      - run: bun test
      - run: bun run build:status
