name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, format, types, test, dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:status

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: bun test --coverage
        continue-on-error: true
        run: |
          mkdir -p coverage
          bun test --parallel=4 --timeout=20000 --coverage --coverage-reporter=text --coverage-reporter=lcov > coverage/test-output.txt 2>&1
      - name: summarize
        if: always()
        run: |
          bun scripts/coverage-summary.ts coverage/lcov.info > coverage/summary.md
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
