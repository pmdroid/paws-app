specVersion: "0.1"
description: Lint, format, typecheck, affected tests, the dashboard build, documentation, dead-code and dependency checks, covering proof scenarios, screenshots of changed screens, an independent review and a security review of high-risk paths must pass before a pull request. After a conflict fix only lint, format, typecheck and the affected tests run, with no reviews. After a failed CI check only the checks that CI check maps to run. GitHub CI always runs the full suite before a merge.
retry:
  maxFailedAttemptsPerItem: 3
  scope: task
  maxFailedReviewAttempts: 4
rerun:
  conflict:
    run: [lint, format, typecheck, test]
    reviews: false
  ci:
    run: failed
setup:
  - id: install
    exec: ["bun", "install", "--frozen-lockfile"]
    timeoutSeconds: 600
items:
  - id: lint
    kind: command
    gate: beforePR
    exec: ["bun", "run", "lint"]
    timeoutSeconds: 300
    ci: "lint, format, types, test, dashboard build"
  - id: format
    kind: command
    gate: beforePR
    exec: ["bun", "run", "fmt:check"]
    timeoutSeconds: 300
    ci: "lint, format, types, test, dashboard build"
  - id: typecheck
    kind: command
    gate: beforePR
    exec: ["bun", "run", "typecheck"]
    timeoutSeconds: 600
    ci: "lint, format, types, test, dashboard build"
  - id: build-dashboard
    kind: command
    gate: beforePR
    exec: ["bun", "run", "build:dashboard"]
    timeoutSeconds: 600
    ci: "lint, format, types, test, dashboard build"
  - id: test
    kind: command
    gate: beforePR
    exec: ["bun", "test", "--parallel=4", "--timeout=20000", "--no-orphans"]
    paths: ["**"]
    except: ["**/*.md", "docs/**"]
    select:
      runner: bun
      always: [test/boundaries.test.ts, test/empty-catches.test.ts]
      full_on:
        - "package.json"
        - "bun.lock"
        - "bunfig.toml"
        - "**/tsconfig*.json"
        - "scripts/**"
      max_selected: 120
      over_max: direct
    timeoutSeconds: 3000
    ci: "test (*)"
  - id: links
    kind: command
    gate: beforePR
    exec: ["bun", "run", "links"]
    timeoutSeconds: 300
  - id: knip
    kind: command
    gate: beforePR
    exec: ["bun", "run", "knip"]
    timeoutSeconds: 300
  - id: proof
    kind: command
    gate: beforePR
    exec: ["bun", "run", "verify:proof", "--changed", "origin/main"]
    timeoutSeconds: 900
    paths:
      - "src/loop/**"
      - "src/db/commands.ts"
      - "src/merge/**"
      - "src/linear/**"
      - "src/github/**"
      - "src/runner-backend/**"
      - "src/scheduler/**"
  - id: visual-proof
    kind: evidence
    gate: beforePR
    paths: ["src/dashboard/**", "landing/**"]
    except: ["**/*.test.ts"]
    media: [image, video]
    minimum: 1
    hint: Screenshot each changed screen at desktop width and at 390 px.
  - id: independent-review
    kind: review
    gate: beforePR
    skill: .agents/skills/review-paws/SKILL.md
    independence:
      differentSession: true
      differentModel: true
    failOn: P1
    scope: diff
    parallel: true
  - id: security-review
    kind: review
    gate: beforePR
    skill: .agents/skills/security-paws/SKILL.md
    independence:
      differentSession: true
      differentModel: true
    failOn: P1
    scope: diff
    parallel: true
    paths:
      - ".agents/**"
      - ".github/workflows/**"
      - ".paws/high-risk-paths"
      - "deploy/**"
      - "src/acp/env.ts"
      - "src/acp/paths.ts"
      - "src/acp/permissions.ts"
      - "src/acp/worktree.ts"
      - "src/auth/**"
      - "src/closeout-spec/run/**"
      - "src/credentials/**"
      - "src/deployment/**"
      - "src/evidence/route.ts"
      - "src/github/jwt.ts"
      - "src/github/token.ts"
      - "src/github/webhook.ts"
      - "src/linear/authorize.ts"
      - "src/linear/oauth.ts"
      - "src/linear/webhook.ts"
      - "src/onboarding/**"
      - "src/process/**"
      - "src/questions/**"
      - "src/runner-control/**"
      - "src/runner-execution/**"
      - "src/runner-identity/**"
      - "src/runner-repository-access/**"
      - "src/server/**"
      - "src/slack/**"
      - "src/dashboard/src/server/**"
      - "src/workspace/**"
      - "src/worktree-checkout/**"
rules:
  - id: migrations-append-only
    summary: Shipped drizzle-kit migrations never change and new ones append to the journal.
    probe: .agents/probes/migrations-append-only.ts
    paths: ["src/db/drizzle-pg/**"]
    failOn: P0
    onFail: fix
  - id: restart-and-ask-from-loop
    summary: Only src/loop applies blocking_question or opens a question.
    probe: .agents/probes/restart-and-ask-from-loop.ts
    failOn: P1
    onFail: fix
