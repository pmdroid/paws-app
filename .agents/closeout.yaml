specVersion: "0.1"
description: Lint, format, typecheck, tests, the status dashboard build, and Markdown links must pass before a pull request.
retry:
  maxFailedAttemptsPerItem: 3
  scope: task
setup:
  - id: install
    exec: ["bun", "install", "--frozen-lockfile"]
    timeoutSeconds: 600
items:
  - id: lint
    kind: command
    gate: beforePR
    exec: ["bun", "run", "lint"]
    timeoutSeconds: 300
  - id: format
    kind: command
    gate: beforePR
    exec: ["bun", "run", "fmt:check"]
    timeoutSeconds: 300
  - id: typecheck
    kind: command
    gate: beforePR
    exec: ["bun", "run", "typecheck"]
    timeoutSeconds: 600
  - id: test
    kind: command
    gate: beforePR
    exec: ["bun", "test"]
    timeoutSeconds: 1800
  - id: build-status
    kind: command
    gate: beforePR
    exec: ["bun", "run", "build:status"]
    timeoutSeconds: 600
  - id: links
    kind: command
    gate: beforePR
    exec: ["bun", "run", "links"]
    timeoutSeconds: 300
