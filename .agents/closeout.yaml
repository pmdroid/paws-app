specVersion: "0.1"
description: Lint, format, typecheck, tests, the status dashboard build, Markdown links, screenshots of changed screens, and an independent review of the diff must pass before a pull request.
retry:
  maxFailedAttemptsPerItem: 3
  scope: task
  maxFailedReviewAttempts: 12
setup:
  - id: install
    exec: ["bun", "install", "--frozen-lockfile"]
    timeoutSeconds: 600
items:
  - id: lint
    kind: command
    gate: beforePR
    exec: ["bun", "run", "lint"]
    timeoutSeconds: 300
  - id: format
    kind: command
    gate: beforePR
    exec: ["bun", "run", "fmt:check"]
    timeoutSeconds: 300
  - id: typecheck
    kind: command
    gate: beforePR
    exec: ["bun", "run", "typecheck"]
    timeoutSeconds: 600
  - id: test
    kind: command
    gate: beforePR
    exec: ["bun", "run", "test"]
    timeoutSeconds: 1800
  - id: build-status
    kind: command
    gate: beforePR
    exec: ["bun", "run", "build:status"]
    timeoutSeconds: 600
  - id: links
    kind: command
    gate: beforePR
    exec: ["bun", "run", "links"]
    timeoutSeconds: 300
  - id: visual-proof
    kind: evidence
    gate: beforePR
    paths: ["src/web/**", "landing/**"]
    media: [image, video]
    minimum: 1
    approval: human
    hint: Screenshot each changed screen at desktop width and at 390 px.
  - id: independent-review
    kind: review
    gate: beforePR
    skill: .agents/skills/review-paws/SKILL.md
    independence:
      differentSession: true
      differentModel: true
    failOn: P1
    scope: diff
    parallel: true
