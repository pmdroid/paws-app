specVersion: "0.1"
description: Lint, format, typecheck, the status dashboard build, Markdown links, screenshots of changed screens, an independent review of the diff, and a security review of high-risk paths must pass before a pull request. The test suite runs in GitHub CI, which must be green before a merge. A merge-queue re-check takes the checks with `ci:` from green GitHub CI on the same commit.
retry:
  maxFailedAttemptsPerItem: 3
  scope: task
  maxFailedReviewAttempts: 4
setup:
  - id: install
    exec: ["bun", "install", "--frozen-lockfile"]
    timeoutSeconds: 600
items:
  - id: lint
    kind: command
    gate: beforePR
    exec: ["bun", "run", "lint"]
    timeoutSeconds: 300
    ci: "lint, format, types, test, dashboard build"
  - id: format
    kind: command
    gate: beforePR
    exec: ["bun", "run", "fmt:check"]
    timeoutSeconds: 300
    ci: "lint, format, types, test, dashboard build"
  - id: typecheck
    kind: command
    gate: beforePR
    exec: ["bun", "run", "typecheck"]
    timeoutSeconds: 600
    ci: "lint, format, types, test, dashboard build"
  - id: build-status
    kind: command
    gate: beforePR
    exec: ["bun", "run", "build:status"]
    timeoutSeconds: 600
    ci: "lint, format, types, test, dashboard build"
  - id: links
    kind: command
    gate: beforePR
    exec: ["bun", "run", "links"]
    timeoutSeconds: 300
  - id: visual-proof
    kind: evidence
    gate: beforePR
    paths: ["src/web/**", "landing/**"]
    media: [image, video]
    minimum: 1
    hint: Screenshot each changed screen at desktop width and at 390 px.
  - id: independent-review
    kind: review
    gate: beforePR
    skill: .agents/skills/review-paws/SKILL.md
    independence:
      differentSession: true
      differentModel: true
    failOn: P1
    scope: diff
    parallel: true
  - id: security-review
    kind: review
    gate: beforePR
    skill: .agents/skills/security-paws/SKILL.md
    independence:
      differentSession: true
      differentModel: true
    failOn: P1
    scope: diff
    parallel: true
    # The same list as .paws/high-risk-paths, which makes a candidate's risk tier high.
    # test/closeout-security-review.test.ts fails when the two differ.
    paths:
      - ".agents/**"
      - ".github/workflows/**"
      - ".paws/high-risk-paths"
      - "deploy/**"
      - "src/acp/env.ts"
      - "src/acp/paths.ts"
      - "src/acp/permissions.ts"
      - "src/acp/worktree.ts"
      - "src/auth/**"
      - "src/closeout-spec/run/**"
      - "src/credentials/**"
      - "src/deployment/**"
      - "src/evidence/route.ts"
      - "src/github/jwt.ts"
      - "src/github/token.ts"
      - "src/github/webhook.ts"
      - "src/linear/authorize.ts"
      - "src/linear/oauth.ts"
      - "src/linear/webhook.ts"
      - "src/onboarding/**"
      - "src/process/**"
      - "src/questions/**"
      - "src/runner-control/**"
      - "src/runner-execution/**"
      - "src/runner-identity/**"
      - "src/runner-repository-access/**"
      - "src/server/**"
      - "src/slack/**"
      - "src/web/src/server/**"
      - "src/workspace/**"
      - "src/worktree-checkout/**"
rules:
  - id: migrations-append-only
    summary: The frozen migration list and shipped migration files never change; a new file is named for a UTC time.
    probe: .agents/probes/migrations-append-only.ts
    paths: ["src/db/**"]
    failOn: P0
    onFail: fix
  - id: restart-and-ask-from-loop
    summary: Only src/loop applies ejected or closeout_rejected, or opens a question.
    probe: .agents/probes/restart-and-ask-from-loop.ts
    failOn: P1
    onFail: fix
